name: Build & Deploy kStore Native APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - '.github/workflows/build_kstore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠 Generate Missing Android Scaffolding & Wrapper
        run: |
          flutter create --org com.kipsway --project-name kstore --platforms android .
          flutter pub get

      - name: 🔑 Prepare Keystore
        run: |
          mkdir -p android
          keytool -genkey -v -keystore android/kipsway.keystore \
            -alias kipsway -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "kipsway2026" -keypass "kipsway2026" \
            -dname "CN=kipsway, OU=kStore, O=kipsway, C=RU"

      - name: 🔨 Compile Genuine Android APK
        run: |
          flutter build apk --release --verbose

      - name: 📦 Deploy compiled APK to GitHub Pages
        run: |
          COMPILED_APK=$(find build/ -name "*release*.apk" | head -n 1)
          if [ -n "$COMPILED_APK" ] && [ -f "$COMPILED_APK" ]; then
            echo "SUCCESS: Found compiled APK $COMPILED_APK of size $(ls -lh $COMPILED_APK)"
            cp "$COMPILED_APK" kStore.apk
            cp "$COMPILED_APK" site/kStore.apk
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add kStore.apk site/kStore.apk
            git commit -m "chore(release): deploy real compiled native kStore.apk [skip ci]" || echo "No changes"
            git push origin main
          else
            echo "ERROR: APK was not built"
            exit 1
          fi
