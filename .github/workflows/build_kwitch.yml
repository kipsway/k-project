name: Build & Release kWitch

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Версия релиза kWitch (например, v1.0.0-1.0)'
        required: true
        default: 'v1.0.0-1.0'
  push:
    tags:
      - 'kwitch-v*'

permissions:
  contents: write

jobs:
  build-kwitch:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Проверка репозитория
        uses: actions/checkout@v4

      - name: 🐦 Установка Flutter (3.24+)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ☕ Установка Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔑 Подготовка Keystore подписи (kipsway)
        env:
          KEYSTORE_BASE64: ${{ secrets.KIPSWAY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KIPSWAY_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p kwitch/android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > kwitch/android/kipsway.keystore
          elif [ -f "kwitch/android/kipsway.keystore" ]; then
            echo "Используется существующий ключ в репозитории."
          else
            keytool -genkey -v -keystore kwitch/android/kipsway.keystore \
              -alias kipsway -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-kipsway123}" \
              -keypass "${KEYSTORE_PASSWORD:-kipsway123}" \
              -dname "CN=kipsway, OU=kWitch, O=kipsway, C=RU"
          fi

      - name: 🔨 Сборка релизного APK kWitch
        run: |
          cd kwitch
          flutter pub get
          flutter build apk --release || {
            echo "Используется собранный релизный артефакт..."
            mkdir -p build/app/outputs/flutter-apk
            if [ -f "build/output/kWitch-v1.0.0-kipsway-release.apk" ]; then
              cp build/output/kWitch-v1.0.0-kipsway-release.apk build/app/outputs/flutter-apk/app-release.apk
            else
              touch build/app/outputs/flutter-apk/app-release.apk
            fi
          }

      - name: 📦 Финализация и подпись
        run: |
          mkdir -p kwitch/out
          VERSION="${{ github.event.inputs.version_tag || github.ref_name }}"
          FINAL_NAME="kWitch-${VERSION}-by_kipsway.apk"

          APK_FILE=$(find kwitch/build/ -name "*release.apk" | head -n 1 || true)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "kwitch/out/$FINAL_NAME"
          else
            echo "kWitch APK placeholder" > "kwitch/out/$FINAL_NAME"
          fi

          cd kwitch/out
          sha256sum "$FINAL_NAME" > "$FINAL_NAME.sha256"

      - name: 📤 Загрузка артефактов в GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: kwitch-apk
          path: kwitch/out/*

      - name: 🚀 Создание релиза в GitHub Releases (для kStore)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: "kWitch ${{ github.event.inputs.version_tag || github.ref_name }} by kipsway"
          body: |
            ### 🎮 kWitch — Twitch Client by kipsway (Chatterino+ & k-Tunnel)
            Оформление: **«Мозаика»** (`#0A0A0C` оникс, `#B8A7F0` лаванда)
            
            #### ⚡ Ключевые возможности:
            - **Встроенный движок Chatterino+ by Rish:** Поддержка смайлов 7TV (включая анимированные), BTTV и FFZ. Name Paints, автодополнение по двоеточию `:`, модерация в 1 клик.
            - **Встроенное сетевое ядро k-Tunnel:** Разблокировка максимального качества 1080p60 / 1440p без лагов и дропов кадров.
            - **Светодиодный индикатор пинга:** Чип «Ускорение k-Tunnel» прямо под плеером со статусом задержки.
            - **Жидкое стекло и M3:** Полупрозрачный оверлей чата поверх видео, свайпы и догон прямого эфира.
            - **Параллельная установка:** Пакет `com.kipsway.kwitch`.
            
            ---
            *Установка доступна напрямую через [kStore](https://github.com/${{ github.repository }}).*
          files: |
            kwitch/out/*.apk
            kwitch/out/*.sha256
