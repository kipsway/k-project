<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Глубокий ониксовый градиент фона -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141318"/>
      <stop offset="50%" stop-color="#0E0D12"/>
      <stop offset="100%" stop-color="#08070A"/>
    </linearGradient>

    <!-- Фирменный лавандовый однотонный градиент самолетика -->
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2D9FC"/>
      <stop offset="100%" stop-color="#B8A7F0"/>
    </linearGradient>

    <!-- Тонкий оптический блик стекла -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#B8A7F0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Мягкое неоновое свечение -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Сквиркл-фон 512x512 -->
  <rect x="16" y="16" width="480" height="480" rx="132" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="132" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>
  <rect x="18" y="18" width="476" height="476" rx="130" fill="none" stroke="#2C2B32" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Самолетик kGram: точная форма NimarkoGram, без ножки, со скругленными нижними углами, однотонный -->
  <g>
    <!-- Неоновая тень силуэта -->
    <path d="M 146 209 
             L 369 125 
             Q 388 118, 382 137 
             L 309 367 
             Q 301 394, 281 374 
             L 141 234 
             Q 124 217, 146 209 Z" 
          fill="#7E6FC4" opacity="0.38" filter="url(#glow)"/>

    <!-- Однотонный лавандовый корпус самолетика NimarkoGram со скругленными углами -->
    <path d="M 146 209 
             L 369 125 
             Q 388 118, 382 137 
             L 309 367 
             Q 301 394, 281 374 
             L 141 234 
             Q 124 217, 146 209 Z" 
          fill="url(#lavenderGrad)"/>

    <!-- Чистая линия сгиба от носика самолетика -->
    <line x1="382" y1="137" x2="230" y2="323" 
          stroke="#7E6FC4" 
          stroke-width="3" 
          stroke-linecap="round"
          stroke-opacity="0.8"/>
  </g>
</svg>
