<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Градиент фона палитры Мозаика -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <!-- Лавандовый градиент для символа kTok -->
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C9FA"/>
      <stop offset="100%" stop-color="#B8A7F0"/>
    </linearGradient>

    <!-- Свечение неонового контура -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Сквиркл-фон 512x512 со скруглением 128px -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="#7E6FC4" stroke-width="4" />

  <!-- Внутренний оптический блик по верхнему краю (Liquid Glass) -->
  <path d="M 144 20 L 368 20 Q 400 20 420 40 Q 300 65 144 20 Z" fill="#B8A7F0" opacity="0.12" />

  <!-- Теневой акцентный слой "Мозаика" (#7E6FC4) со смещением -->
  <g transform="translate(14, 12)" opacity="0.75" filter="url(#glow)">
    <path d="M 170 120 C 153 120 140 133 140 150 L 140 360 C 140 377 153 390 170 390 C 187 390 200 377 200 360 L 200 270 L 285 365 C 293 374 305 379 317 379 C 344 379 362 353 350 330 L 278 246 L 342 178 C 359 160 349 131 325 131 C 313 131 302 136 295 144 L 200 245 L 200 150 C 200 133 187 120 170 120 Z" fill="#7E6FC4" />
    <!-- Хвостик ноты TikTok -->
    <path d="M 315 125 C 338 125 360 138 371 158 C 376 167 370 178 359 178 C 354 178 349 175 346 170 C 339 158 326 150 312 150 L 300 150 L 300 125 Z" fill="#7E6FC4" />
  </g>

  <!-- Основной монограммный символ kTok в лавандовом градиенте -->
  <g>
    <path d="M 170 120 C 153 120 140 133 140 150 L 140 360 C 140 377 153 390 170 390 C 187 390 200 377 200 360 L 200 270 L 285 365 C 293 374 305 379 317 379 C 344 379 362 353 350 330 L 278 246 L 342 178 C 359 160 349 131 325 131 C 313 131 302 136 295 144 L 200 245 L 200 150 C 200 133 187 120 170 120 Z" fill="url(#lavenderGrad)" />
    <!-- Хвостик ноты TikTok -->
    <path d="M 315 125 C 338 125 360 138 371 158 C 376 167 370 178 359 178 C 354 178 349 175 346 170 C 339 158 326 150 312 150 L 300 150 L 300 125 Z" fill="url(#lavenderGrad)" />
  </g>
</svg>
