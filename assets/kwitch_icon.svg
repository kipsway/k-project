<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C9FA"/>
      <stop offset="100%" stop-color="#B8A7F0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Сквиркл-фон 512x512 со скруглением 128px -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="#7E6FC4" stroke-width="4" />

  <!-- Внутренний оптический блик по верхнему краю (Liquid Glass) -->
  <path d="M 144 20 L 368 20 Q 400 20 420 40 Q 300 65 144 20 Z" fill="#B8A7F0" opacity="0.12" />

  <!-- Теневой акцентный контур (#7E6FC4) -->
  <g transform="translate(10, 10)" opacity="0.6" filter="url(#glow)">
    <path d="M 100 110 L 380 110 L 412 142 L 412 334 L 332 334 L 292 374 L 252 334 L 180 334 L 100 254 Z" fill="#7E6FC4" />
  </g>

  <!-- Фирменный баббл Twitch/Chatterino+ в палитре «Мозаика» -->
  <g>
    <!-- Основной корпус баббла -->
    <path d="M 100 110 L 380 110 L 412 142 L 412 334 L 332 334 L 292 374 L 252 334 L 180 334 L 100 254 Z" fill="url(#lavenderGrad)" />
    <!-- Внутренний глубокий оникс -->
    <path d="M 132 142 L 380 142 L 380 302 L 316 302 L 284 334 L 252 302 L 180 302 L 132 254 Z" fill="#0A0A0C" />
    
    <!-- Глаза-индикаторы чата Chatterino+ (Лаванда #B8A7F0) -->
    <rect x="220" y="190" width="28" height="60" rx="14" fill="url(#lavenderGrad)" />
    <rect x="290" y="190" width="28" height="60" rx="14" fill="url(#lavenderGrad)" />
    
    <!-- Индикатор ускорения k-Tunnel (зеленый светодиод в нижнем углу) -->
    <circle cx="348" cy="272" r="8" fill="#3FB950" />
  </g>
</svg>
