<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>k-Ecosystem Icons Preview (by kipsway)</title>
  <style>
    body {
      background-color: #0A0A0C;
      color: #ECEBF1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p {
      color: #8D8A99;
      margin-bottom: 48px;
      font-size: 16px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      max-width: 1000px;
    }
    .card {
      background: #0F0F12;
      border: 1px solid #2C2B32;
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 160px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #7E6FC4;
    }
    .card img {
      width: 120px;
      height: 120px;
      border-radius: 32px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
    }
    .title {
      font-weight: 700;
      font-size: 18px;
      color: #ECEBF1;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #B8A7F0;
    }
  </style>
</head>
<body>
  <h1>k-Ecosystem App Icons</h1>
  <p>Дизайн-система «Жидкое стекло + Material You 3 + Мозаика» (by kipsway)</p>
  <div class="grid">
    <div class="card">
      <img src="kstore_icon.svg" alt="kStore">
      <div class="title">kStore</div>
      <div class="subtitle">App Hub</div>
    </div>
    <div class="card">
      <img src="ktok_icon.svg" alt="kTok">
      <div class="title">kTok</div>
      <div class="subtitle">TikTok Mod</div>
    </div>
    <div class="card">
      <img src="kgram_icon.svg" alt="kGram">
      <div class="title">kGram</div>
      <div class="subtitle">Telegram Fork</div>
    </div>
    <div class="card">
      <img src="ktube_icon.svg" alt="kTube">
      <div class="title">kTube</div>
      <div class="subtitle">YouTube 4K</div>
    </div>
    <div class="card">
      <img src="kwitch_icon.svg" alt="kWitch">
      <div class="title">kWitch</div>
      <div class="subtitle">Twitch + 7TV</div>
    </div>
  </div>
</body>
</html>
