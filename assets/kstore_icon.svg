<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Глубокий ониксовый градиент фона -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141318"/>
      <stop offset="50%" stop-color="#0E0D12"/>
      <stop offset="100%" stop-color="#08070A"/>
    </linearGradient>

    <!-- Фирменный лавандовый градиент пакета -->
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#D4C9FA"/>
      <stop offset="100%" stop-color="#B8A7F0"/>
    </linearGradient>

    <!-- Стеклянный блик рамки -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#B8A7F0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Сквиркл-фон 512x512 -->
  <rect x="16" y="16" width="480" height="480" rx="132" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="132" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>
  <rect x="18" y="18" width="476" height="476" rx="130" fill="none" stroke="#2C2B32" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Фирменный пакет kStore с четкой читаемой буквой 'k' -->
  <g>
    <!-- Неоновая тень пакета -->
    <rect x="136" y="196" width="240" height="216" rx="38" fill="#7E6FC4" opacity="0.38" filter="url(#glow)"/>
    <path d="M 204 196 C 204 136 308 136 308 196" fill="none" stroke="#7E6FC4" stroke-width="22" stroke-linecap="round" opacity="0.38" filter="url(#glow)"/>

    <!-- Ручка пакета (дуга сверху) -->
    <path d="M 204 196 C 204 136 308 136 308 196" fill="none" stroke="url(#lavenderGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Корпус пакета -->
    <rect x="136" y="196" width="240" height="216" rx="38" fill="url(#lavenderGrad)"/>

    <!-- Чистая, идеально читаемая геометрическая буква 'k' (Оникс #0A0A0C) -->
    <!-- Вертикальная стойка -->
    <rect x="208" y="244" width="18" height="120" rx="9" fill="#0A0A0C"/>
    <!-- Верхняя диагональная ветвь -->
    <path d="M 292 254 L 222 312" stroke="#0A0A0C" stroke-width="18" stroke-linecap="round"/>
    <!-- Нижняя диагональная ветвь -->
    <path d="M 252 290 L 296 354" stroke="#0A0A0C" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
