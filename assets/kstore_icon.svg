<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C9FA"/>
      <stop offset="100%" stop-color="#B8A7F0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Сквиркл-фон 512x512 со скруглением 128px -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="#7E6FC4" stroke-width="4" />

  <!-- Внутренний оптический блик по верхнему краю (Liquid Glass) -->
  <path d="M 144 20 L 368 20 Q 400 20 420 40 Q 300 65 144 20 Z" fill="#B8A7F0" opacity="0.12" />

  <!-- Теневой акцентный контур (#7E6FC4) -->
  <g transform="translate(10, 10)" opacity="0.6" filter="url(#glow)">
    <rect x="110" y="180" width="292" height="230" rx="40" fill="#7E6FC4" />
    <path d="M 176 180 C 176 130 206 90 256 90 C 306 90 336 130 336 180" stroke="#7E6FC4" stroke-width="32" stroke-linecap="round" fill="none" />
  </g>

  <!-- Фирменная корзина-хаб kStore (Лаванда #B8A7F0) -->
  <g>
    <!-- Ручка сумки/хаба -->
    <path d="M 176 180 C 176 130 206 90 256 90 C 306 90 336 130 336 180" stroke="url(#lavenderGrad)" stroke-width="30" stroke-linecap="round" fill="none" />
    
    <!-- Корпус хаба -->
    <rect x="110" y="180" width="292" height="230" rx="40" fill="url(#lavenderGrad)" />
    
    <!-- Внутренний символ k-Ecosystem (Глубокий оникс #0A0A0C) -->
    <!-- Монограмма 'k' -->
    <path d="M 215 235 L 215 355 M 295 245 L 230 305 L 300 355" stroke="#0A0A0C" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
