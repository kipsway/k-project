<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C9FA"/>
      <stop offset="100%" stop-color="#B8A7F0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Сквиркл-фон 512x512 со скруглением 128px -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="#7E6FC4" stroke-width="4" />

  <!-- Внутренний оптический блик по верхнему краю (Liquid Glass) -->
  <path d="M 144 20 L 368 20 Q 400 20 420 40 Q 300 65 144 20 Z" fill="#B8A7F0" opacity="0.12" />

  <!-- Теневой акцентный контур (#7E6FC4) со смещением -->
  <g transform="translate(10, 10)" opacity="0.6" filter="url(#glow)">
    <rect x="96" y="130" width="320" height="232" rx="64" fill="#7E6FC4" />
    <polygon points="220,195 330,246 220,297" fill="#0A0A0C" />
  </g>

  <!-- Основной экран YouTube в стиле kTube (Лаванда #B8A7F0) -->
  <g>
    <!-- Прямоугольник экрана со скруглением 64px -->
    <rect x="96" y="130" width="320" height="232" rx="64" fill="url(#lavenderGrad)" />
    <!-- Символ воспроизведения Play (Глубокий оникс #0A0A0C) -->
    <polygon points="220,195 330,246 220,297" fill="#0A0A0C" />
    <!-- Индикатор туннеля k-Tunnel (быстрый поток) -->
    <path d="M 290 326 L 380 326" stroke="#7E6FC4" stroke-width="6" stroke-linecap="round" />
    <path d="M 330 338 L 380 338" stroke="#7E6FC4" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
