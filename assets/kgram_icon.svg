<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Глубокий ониксовый градиент фона -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141318"/>
      <stop offset="50%" stop-color="#0E0D12"/>
      <stop offset="100%" stop-color="#08070A"/>
    </linearGradient>

    <!-- Фирменный лавандовый градиент -->
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#D4C9FA"/>
      <stop offset="100%" stop-color="#B8A7F0"/>
    </linearGradient>

    <!-- Тонкий оптический блик стекла -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#B8A7F0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Мягкое неоновое свечение -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Сквиркл-фон 512x512 -->
  <rect x="16" y="16" width="480" height="480" rx="132" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="132" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>
  <rect x="18" y="18" width="476" height="476" rx="130" fill="none" stroke="#2C2B32" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Каноничный самолетик Telegram с математически ровной линией сгиба и идеальным схождением -->
  <g>
    <!-- Неоновая тень самолетика -->
    <path d="M 104 256 L 416 128 L 356 400 L 236 344 L 186 394 L 176 304 Z" 
          fill="#7E6FC4" opacity="0.4" filter="url(#glow)"/>

    <!-- Правое нижнее крыло (средний лавандовый тон) -->
    <polygon points="416,128 356,400 236,344" fill="#9C89E8"/>

    <!-- Нижний киль (примыкает строго к вершине сгиба 236,344) -->
    <polygon points="236,344 186,394 176,304" fill="#7E6FC4"/>

    <!-- Главное верхнее крыло (яркая чистая лаванда) -->
    <polygon points="104,256 416,128 236,344" fill="url(#lavenderGrad)"/>
  </g>
</svg>
