<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C9FA"/>
      <stop offset="100%" stop-color="#B8A7F0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Сквиркл-фон 512x512 со скруглением 128px -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="#7E6FC4" stroke-width="4" />

  <!-- Внутренний оптический блик по верхнему краю (Liquid Glass) -->
  <path d="M 144 20 L 368 20 Q 400 20 420 40 Q 300 65 144 20 Z" fill="#B8A7F0" opacity="0.12" />

  <!-- Теневой акцентный контур (#7E6FC4) -->
  <g transform="translate(10, 10)" opacity="0.6" filter="url(#glow)">
    <path d="M 110 248 L 390 135 C 402 130 412 142 406 153 L 345 375 C 340 392 320 398 306 386 L 230 320 L 175 365 C 168 371 157 367 156 358 L 148 302 L 310 190 L 195 275 L 110 248 Z" fill="#7E6FC4" />
  </g>

  <!-- Фирменный самолетик Telegram в стилистике kGram (Лаванда #B8A7F0) -->
  <g>
    <!-- Основное крыло -->
    <path d="M 110 248 L 390 135 C 402 130 412 142 406 153 L 345 375 C 340 392 320 398 306 386 L 230 320 L 310 190 L 148 302 L 110 248 Z" fill="url(#lavenderGrad)" />
    <!-- Нижний киль -->
    <path d="M 230 320 L 175 365 C 168 371 157 367 156 358 L 165 290 L 230 320 Z" fill="#7E6FC4" />
    <!-- Акцентное крыло со скосом -->
    <path d="M 230 320 L 310 190 L 195 275 L 230 320 Z" fill="#9F8EE0" />
  </g>
</svg>
